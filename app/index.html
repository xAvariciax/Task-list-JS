<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task list</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main id="main">
    <h1 id="main-title">Task List</h1>
    <form id="main-form">
      <div class="main-form-input-container" id="task-container">
        <input type="text" name="task-input-text" id="task-input-text" placeholder="New Task...">
        <button id="main-form-button" type="submit">
          <p id="text-button"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
          </p>
        </button>
        <p class="main-form-helper-text">no debe estar vacio</p>
      </div>
    </form>
    <ul id="task-list">
    </ul>
    <div id="task-list-counter" class="task-list-counter-position">
      <div id="task-list-counter-num">Tasks: 0</div>
      <div id="task-list-counter-completed">completed: 0</div>
      <div id="task-list-counter-incomplete">incomplete: 0</div>
    </div>
  </main>
  <script src="index.js"></script>
</body>

</html>
